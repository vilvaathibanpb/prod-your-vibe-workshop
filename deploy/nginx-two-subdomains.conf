# /etc/nginx/sites-available/shiplog — real droplet demo: frontend and API on their own subdomains.
# Change the two names to yours. certbot --nginx adds the HTTPS parts.

# Frontend: built files only
server {
    listen 80;
    server_name shiplog.bus-music.xyz;

    root /var/www/shiplog;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API: everything goes to the backend
server {
    listen 80;
    server_name shiplog-api.bus-music.xyz;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
